<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 测试用例设计助手设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="settings-shell">
      <header>
        <p class="eyebrow">AI 测试用例设计助手</p>
        <h1>模型设置</h1>
        <p class="summary">API Key 只保存在你的浏览器本地，用于直接调用你配置的 OpenAI 兼容模型服务。</p>
      </header>

      <section class="form">
        <label>
          <span>API Key</span>
          <input id="apiKey" type="password" placeholder="sk-...">
        </label>

        <label>
          <span>接口地址 Base URL</span>
          <input id="baseUrl" placeholder="https://api.openai.com/v1">
        </label>

        <label>
          <span>模型名称</span>
          <input id="model" placeholder="gpt-4o-mini">
        </label>

        <label class="check-row">
          <input id="strictSchema" type="checkbox">
          <span>使用严格 JSON Schema 输出</span>
        </label>

        <div class="actions">
          <button class="primary" id="saveBtn" type="button">保存</button>
          <button id="testBtn" type="button">测试连接</button>
          <button id="backBtn" type="button">返回侧边栏</button>
          <button id="clearBtn" type="button">清除 Key</button>
        </div>

        <p class="status" id="statusText">未检测</p>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
