<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Test Case Designer</title>
    <link rel="stylesheet" href="sidepanel.css?v=0.3.1">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="title-group">
          <div class="app-name">AI Test Case Designer</div>
          <div class="app-subtitle">Test Case Chat</div>
        </div>
        <div class="topbar-actions">
          <span class="status" id="statusText">Not configured</span>
          <button class="ghost" id="settingsBtn" type="button">Settings</button>
          <button class="ghost" id="historyBtn" type="button">History</button>
          <button class="ghost" id="clearBtn" type="button">New</button>
        </div>
      </header>

      <section class="conversation" id="messages" aria-live="polite"></section>

      <footer class="composer-wrap">
        <div class="composer">
          <textarea id="chatInput" rows="3" placeholder="Describe the requirement. Example: Design login test cases for phone + password login, lock after 5 failed attempts."></textarea>
          <div class="composer-bar">
            <span class="hint">Enter to send, Shift+Enter for newline</span>
            <button class="send-button" id="sendBtn" type="button">Send</button>
          </div>
        </div>
      </footer>
    </main>

    <script src="sidepanel.js?v=0.3.1"></script>
  </body>
</html>
